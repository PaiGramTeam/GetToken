name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      GHP_TOKEN: ${{ secrets.GHP_TOKEN }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'zulu'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
    - name: Build with Gradle
      run: ./gradlew assembleRelease
    - name: Download package
      run: |
        chmod +x .github/download.sh
        bash .github/download.sh
    - name: Patch package
      run: |
        mkdir out && mv app/build/outputs/apk/release/app-release.apk .
        java -jar gradle/lspatch/jar-v1.2.jar -f -l 2 -m app-release.apk -o out -k .github/signkey.jks ${{ secrets.SIGNING_KEY_PASSWORD }} ${{ secrets.SIGNING_KEY_ALIAS }} ${{ secrets.SIGNING_KEY_PASSWORD }} miyoushe.apk
        mv app-release.apk out
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: out
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
    - name: Send to Telegram
      run: |
        python -m pip install -r .github/scripts/requirements.txt
        python .github/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }}
    - name: Get Apk Info
      id: apk
      uses: JantHsueh/get-apk-info-action@master
      with:
        apkPath: miyoushe.apk
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.apk.outputs.versionNum }}
        working_directory: out
        files: |
          *.apk
